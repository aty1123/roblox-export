<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
<!--   <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
  <meta name="viewport" content="width=1024">
  <title>IronMountain 관리자 대시보드</title>
  <link rel="icon" href="https://img.icons8.com/ios-filled/50/ffffff/hammer.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background-color: #0e0e0e;
      color: #f0f0f0;
      display: flex;
      flex-direction: column; /* ← 세로 정렬 */
      justify-content: center; /* ← 상단 정렬 */
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .logo {
      max-width: 500px;
      width: 90%;
      margin-bottom: 30px;
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    .container {
      background: #1a1a1a;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 1000px;
    }
    h1 {
      color: #ffffff;
      text-align: center;
      margin-bottom: 24px;
      font-size: 24px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #333;
      border-radius: 6px;
      background-color: #2a2a2a;
      color: #f0f0f0;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }
    .controls > * {
      flex: 1;
      min-width: 150px;
    }
    .login-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      padding: 12px;
      font-size: 16px;
      font-weight: 600;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #666;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #333;
      text-align: center;
    }
    th {
      background-color: #111;
      cursor: pointer;
    }
    th.sorted-asc::after {
      content: " ▲";
      color: #aaa;
    }
    th.sorted-desc::after {
      content: " ▼";
      color: #aaa;
    }
    tr:hover {
      background-color: #1e1e1e;
    }
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }
    .error {
      color: #ff5e5e;
      margin-top: 10px;
      text-align: center;
    }
    .loading {
      color: #ffffff;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
<!--   <img src="https://i.ibb.co/fGZcTmvr/pngtree-bus-stop-sign-png-image-6140912.png" alt="철산버스시뮬로고.png"> -->
  <img src="https://i.ibb.co/fGZcTmvr/pngtree-bus-stop-sign-png-image-6140912.png" alt="철산버스 로고" class="logo">
  <div class="container" id="main">
    <h1>관리자 로그인</h1>
    <div class="login-controls">
      <input type="password" id="pw" placeholder="관리자 비밀번호 입력" />
      <button onclick="login()">로그인</button>
      <div id="error" class="error"></div>
    </div>
  </div>

  <script>
    let currentPassword = "";
    let currentPage = 1;
    let rowsPerPage = 10;
    let allData = [];
    let filtered = [];
    let currentSortKey = null;
    let sortAsc = true;

    function login() {
      const pw = document.getElementById("pw").value;
      const error = document.getElementById("error");
      if (!pw) {
        error.textContent = "비밀번호를 입력해주세요.";
        error.className = "error";
        return;
      }
      error.textContent = "로그인 중...";
      error.className = "loading";

      fetch("/admin/data", {
        headers: { Authorization: "Bearer " + pw },
      })
        .then((res) => {
          if (!res.ok) throw new Error("인증 실패");
          return res.json();
        })
        .then((data) => {
          currentPassword = pw;
          allData = Object.entries(data).map(([id, u]) => ({ id, ...u }));
          filtered = [...allData];
          renderDashboard();
        })
        .catch(() => {
          error.textContent = "비밀번호가 틀렸습니다.";
          error.className = "error";
        });
    }

    function bindDonations() {
      const panel = document.getElementById("donation-monitor");
      const ranks = document.getElementById("donation-ranks");
      const status = document.getElementById("donation-status");
      const user = document.getElementById("donation-user");
      const output = document.getElementById("donation-result");
      let controller, version, timer, lookupId = 0;
      async function lookup() {
        const id = user.value.trim(), serial = ++lookupId;
        const recent = document.getElementById("donation-recent");
        recent.replaceChildren();
        if (!/^[1-9]\d{0,15}$/.test(id)) { output.textContent = "숫자 User ID를 입력하세요."; return; }
        try {
          const result = await fetch("/admin/donations/" + id, { headers: { Authorization: "Bearer " + currentPassword } });
          if (!result.ok) throw new Error();
          const d = await result.json();
          if (serial !== lookupId || user.value.trim() !== id) return;
          output.textContent = id + " · 누적 " + d.total.toLocaleString() + " R$ · " + d.count.toLocaleString() +
            "회" + (d.last ? " · 최근 " + d.last.amount + " R$ · 상품 " + d.last.productId + " · " + new Date(d.last.at).toLocaleString("ko-KR") : "");
          recent.replaceChildren(...d.recent.map(event => {
            const row = document.createElement("li");
            row.textContent = new Date(event.at).toLocaleString("ko-KR") + " · " + event.amount + " R$ · 상품 " + event.productId + " · 영수증 " + event.id;
            return row;
          }));
        } catch { if (serial === lookupId) output.textContent = "조회 실패 · 로그인을 확인한 뒤 다시 시도하세요."; }
      }
      async function poll() {
        if (!panel.open || !panel.isConnected || document.hidden) return;
        const active = new AbortController();
        controller = active;
        let delay = 1000;
        try {
          const res = await fetch("/public/rankings/top50" + (version ? "?wait=1&since=" + version : ""), { signal: active.signal });
          if (res.status !== 204) {
            if (!res.ok) throw new Error();
            const feed = await res.json();
            if (!Array.isArray(feed.Support)) throw new Error();
            version = feed.version;
            ranks.replaceChildren(...feed.Support.map(({ id, value }) => {
              const entry = document.createElement("li"), select = document.createElement("button");
              const name = allData.find(row => String(row.id) === String(id))?.username;
              select.type = "button"; select.textContent = (name || id) + " · " + value.toLocaleString() + " R$";
              select.onclick = () => { user.value = String(id); lookup(); };
              entry.append(select); return entry;
            }));
          }
          status.textContent = ranks.children.length ? "실시간 후원 TOP 50" : "첫 후원 영수증을 기다리고 있습니다.";
        } catch { if (!active.signal.aborted) { status.textContent = "재연결 중 · 마지막 순위를 표시합니다."; delay = 5000; } }
        if (controller === active && !active.signal.aborted) timer = setTimeout(poll, delay);
      }
      function sync() {
        controller?.abort(); clearTimeout(timer);
        if (panel.open && !document.hidden) poll();
      }
      panel.ontoggle = sync;
      document.addEventListener("visibilitychange", sync);
      document.getElementById("donation-lookup").onclick = lookup;
    }

    function renderDashboard() {
      const container = document.getElementById("main");
      container.innerHTML = `
        <h1>IronMountain 유저 데이터베이스</h1>
        <details id="donation-monitor" style="margin: 1em 0">
          <summary>로벅스 후원 관제</summary>
          <p id="donation-status" role="status"></p>
          <ol id="donation-ranks"></ol>
          <label>User ID <input id="donation-user" inputmode="numeric"></label>
          <button id="donation-lookup" type="button">후원 내역 조회</button>
          <p id="donation-result" aria-live="polite"></p>
          <ol id="donation-recent"></ol>
        </details>
        <div class="controls">
          <input type="text" id="search" placeholder="User ID 또는 Username 검색" />
          <select id="perPage">
            <option value="10">10개씩 보기</option>
            <option value="25">25개씩 보기</option>
            <option value="50">50개씩 보기</option>
          </select>
          <button onclick="refresh()">새로고침</button>
        </div>
        <table>
          <thead>
            <tr>
              <th onclick="sortBy('id')">User ID</th>
              <th onclick="sortBy('money')">Money</th>
              <th onclick="sortBy('playtime')">Playtime</th>
              <th onclick="sortBy('username')">Username</th>
              <th onclick="sortBy('updatedAt')">Updated</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="pagination">
          <button onclick="changePage(-1)">&lt; 이전</button>
          <span id="pageInfo"></span>
          <button onclick="changePage(1)">다음 &gt;</button>
        </div>
      `;

      bindDonations();
      document.getElementById("perPage").value = rowsPerPage;
      document.getElementById("perPage").addEventListener("change", e => {
        rowsPerPage = +e.target.value;
        currentPage = 1;
        updateTable();
      });

      document.getElementById("search").addEventListener("input", e => {
        const q = e.target.value.toLowerCase();
        filtered = allData.filter(row =>
          row.id.includes(q) || (row.username ?? "Unknown").toLowerCase().includes(q)
        );
        currentPage = 1;
        updateTable();
      });

      updateTable();
    }

    function updateTable() {
      const start = (currentPage - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const pageData = filtered.slice(start, end);

      const tbody = document.getElementById("rows");
      tbody.replaceChildren(...pageData.map(u => {
        const row = document.createElement("tr");
        for (const value of [u.id, u.money ?? 0, u.playtime ?? 0, u.username ?? "Unknown", new Date(u.updatedAt).toLocaleString()]) {
          row.insertCell().textContent = String(value);
        }
        return row;
      }));

      const pageInfo = document.getElementById("pageInfo");
      const totalPages = Math.max(1, Math.ceil(filtered.length / rowsPerPage));
      if (currentPage < 1) currentPage = totalPages;
      if (currentPage > totalPages) currentPage = 1;
      pageInfo.textContent = `${currentPage} / ${totalPages}`;

      document.querySelectorAll("th").forEach(th => {
        th.classList.remove("sorted-asc", "sorted-desc");
        if (th.textContent.replace(/\s+/g, '') === keyToLabel(currentSortKey)) {
          th.classList.add(sortAsc ? "sorted-asc" : "sorted-desc");
        }
      });
    }

    function keyToLabel(key) {
      return {
        id: "User ID",
        money: "Money",
        playtime: "Playtime",
        username: "Username",
        updatedAt: "Updated"
      }[key];
    }

     function refresh() {
      fetch("/admin/data", {
        headers: { Authorization: "Bearer " + currentPassword },
      })
        .then((res) => {
          if (!res.ok) throw new Error("인증 실패");
          return res.json();
        })
        .then((data) => {
          allData = Object.entries(data).map(([id, u]) => ({ id, ...u }));
    
          // 검색어 반영한 채 필터링 유지
          const q = document.getElementById("search").value.toLowerCase();
          filtered = allData.filter(row =>
            row.id.includes(q) || (row.username ?? "Unknown").toLowerCase().includes(q)
          );
    
          // 정렬 기준 유지
          if (currentSortKey) {
            filtered.sort((a, b) => {
              const valA = currentSortKey === 'updatedAt' ? new Date(a[currentSortKey]) : a[currentSortKey] ?? 0;
              const valB = currentSortKey === 'updatedAt' ? new Date(b[currentSortKey]) : b[currentSortKey] ?? 0;
              if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
              return sortAsc ? valA - valB : valB - valA;
            });
          }
    
          updateTable();
        })
        .catch((err) => {
          console.error("❌ 새로고침 실패:", err);
        });
    }



    function changePage(dir) {
      const totalPages = Math.max(1, Math.ceil(filtered.length / rowsPerPage));
      currentPage += dir;
      if (currentPage < 1) currentPage = totalPages;
      if (currentPage > totalPages) currentPage = 1;
      updateTable();
    }

    function sortBy(key) {
      sortAsc = currentSortKey === key ? !sortAsc : true;
      currentSortKey = key;

      filtered.sort((a, b) => {
        const valA = key === 'updatedAt' ? new Date(a[key]) : a[key] ?? 0;
        const valB = key === 'updatedAt' ? new Date(b[key]) : b[key] ?? 0;
        if (typeof valA === 'string') return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
        return sortAsc ? valA - valB : valB - valA;
      });

      currentPage = 1;
      updateTable();
    }
  </script>
</body>
</html>
